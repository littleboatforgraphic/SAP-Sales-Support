version: '3.8'

services:
  sales-admin-sap-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sales-admin-sap-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist database file
      - ./data:/app/data
      # Mount SQLite database if using SQLite
      - ./sales_admin_sap.db:/app/sales_admin_sap.db
      # Persist logs
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - sales-admin-network

networks:
  sales-admin-network:
    driver: bridge
