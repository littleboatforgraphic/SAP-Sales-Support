version: '3.8'

services:
  sales-admin-autocount-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sales-admin-autocount-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist database and logs (DATABASE_URL can point into ./data)
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - sales-admin-network

  # Mailbox pollers run as separate containers sharing the same DB.
  # Uncomment as needed once their credentials are configured in .env.
  #
  # gmail-poller:
  #   build: .
  #   container_name: sales-admin-gmail-poller
  #   env_file: [.env]
  #   volumes:
  #     - ./data:/app/data
  #     - ./logs:/app/logs
  #   command: ["python", "gmail_poller.py"]
  #   restart: unless-stopped
  #   networks: [sales-admin-network]
  #
  # outlook-poller:
  #   build: .
  #   container_name: sales-admin-outlook-poller
  #   env_file: [.env]
  #   volumes:
  #     - ./data:/app/data
  #     - ./logs:/app/logs
  #     # MSAL token cache produced by setup_test_outlook.py
  #     - ./token_cache.json:/app/token_cache.json
  #   command: ["python", "outlook_poller.py"]
  #   restart: unless-stopped
  #   networks: [sales-admin-network]

networks:
  sales-admin-network:
    driver: bridge
